const DB_KEY='hocvuilop4_giuaky1_2026_v2';
const APP={db:{profiles:[],selectedId:null},view:'home',lessonId:null,teacherLesson:null,menu:false,recorder:null,recording:null,blobs:{},soundError:'',lastToast:'',showTips:false};
const $=sel=>document.querySelector(sel);
function escapeHtml(str){return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(str){return String(str??'').normalize('NFKC').toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[.,!?;]+$/g,'').replace(/\s+/g,' ');}
function comparable(s){let v=norm(s);return /^[-\d\s.]+$/.test(v)?v.replace(/[ .]/g,''):v;}
function equalAnswer(a,b){return comparable(a)===comparable(b);}
function allQ(l){return l.sections.flatMap(s=>s.questions);}
function fmt(n){return Math.round(n*100)/100;}
function lesson(id){return COURSES.find(l=>l.id===id);}
function user(){return APP.db.profiles.find(p=>p.id===APP.db.selectedId) || null;}
function getWork(l,create=false){let p=user();if(!p)return null;if(!p.work)p.work={};if(!p.work[l.id]&&create)p.work[l.id]={startedAt:Date.now(),answers:{},grades:{},notes:{},submittedAt:null,readingIdx:0,topicIdx:0};return p.work[l.id]||null;}
function save(){try{localStorage.setItem(DB_KEY,JSON.stringify(APP.db));}catch(err){APP.lastToast='Máy không lưu được dữ liệu. Hãy xuất bản sao lưu JSON.';}}
function load(){try{let obj=JSON.parse(localStorage.getItem(DB_KEY)||'null');if(obj&&Array.isArray(obj.profiles)){APP.db=obj;}}catch(err){}if(!user()&&APP.db.profiles.length){APP.db.selectedId=APP.db.profiles[0].id;}}
function isManual(q){return ['long','speaking','dictation'].includes(q.type);}
function itemRight(q,value){if(!itemAnswered(q,value))return false;if(q.type==='mc')return Number(value)===q.answer;
 let answers=Array.isArray(q.answer)?q.answer:[q.answer];return answers.some(ans=>equalAnswer(ans,value));}
function itemAnswered(q,value){return q.type==='mc'? (value!==undefined && value!==null && value!=='') : String(value??'').trim().length>0;}
function stats(l,w){let scoreAuto=0,totalAuto=0,manualMax=0,manualScore=0,manualDone=0,manualCount=0,total=0,answered=0;
 for(let q of allQ(l)){total+=q.weight;let val=w?.answers?.[q.id];if(itemAnswered(q,val))answered++;
 if(isManual(q)){manualMax+=q.weight;manualCount++;if(w&&Object.prototype.hasOwnProperty.call(w.grades||{},q.id)){manualScore+=Number(w.grades[q.id])||0;manualDone++;}}
 else{totalAuto+=q.weight;if(w?.submittedAt && itemRight(q,val))scoreAuto+=q.weight;}}
 return {total,scoreAuto,totalAuto,manualMax,manualScore,manualDone,manualCount,answered,count:allQ(l).length,final:(!!w?.submittedAt&&manualDone===manualCount),raw:scoreAuto+manualScore,score10:total?((scoreAuto+manualScore)/total*10):0};}
function displayScore(l,w){if(!w?.submittedAt)return 'Chưa nộp';let s=stats(l,w);return s.final?`${fmt(s.score10)}/10`:`${fmt(s.scoreAuto)}/${fmt(s.totalAuto)} tự động`}
function completionTag(l,w){if(!w)return '<span class="tag neutral">Chưa làm</span>';if(!w.submittedAt)return '<span class="tag warn">Đang làm</span>';let s=stats(l,w);if(s.final)return '<span class="tag good">Đã chấm</span>';return '<span class="tag warn">Chờ gia sư</span>';}

 <div class="panel" style="margin-top:25px"><h3>🧑‍🏫 Gợi ý cho gia sư</h3><p class="small muted">Môn trắc nghiệm và điền đáp án được tự chấm. Những phần đọc thành tiếng, Speaking và viết tự luận cần người dạy đánh giá bằng bảng chấm điểm. Điểm hiển thị tạm tính sẽ không tính phần chưa chấm.</p><div class="strip"><span class="pill">📅 27/10: Đọc Tiếng Việt</span><span class="pill">📅 28/10: Viết + Global Success</span><span class="pill">📅 29/10: Toán + Oxford</span></div></div>`}
function saveAnswer(id,value){let l=lesson(APP.lessonId),w=getWork(l,true);if(!w||w.submittedAt)return;w.answers[id]=value;save();let stat=stats(l,w);let a=$('#progressCount');if(a)a.textContent=`${stat.answered}/${stat.count} nhiệm vụ đã trả lời`;}
function escText(s){return escapeHtml(s).replace(/\n/g,'<br>')}
function qHtml(q,idx,l,w){let answered=w?.answers?.[q.id],submitted=!!w?.submittedAt,manual=isManual(q),isCorrect=submitted&&!manual&&itemRight(q,answered),number=`Câu ${idx}`;
 if(l.special==='read'&&q.id.startsWith('read_q')){let rd=l.readings[w?.readingIdx||0];q={...q,prompt:`${q.id==='read_q1'?'Câu hỏi 1':'Câu hỏi 2'}: ${rd.questions[q.id==='read_q1'?0:1]}`}}
 let ans=q.options&&q.type==='mc'?`<div class="choices" role="group" aria-label="${escapeHtml(q.prompt)}">${q.options.map((o,i)=>`<button class="choice ${String(answered)===String(i)?'selected':''} ${submitted?(i===q.answer?'correct':String(answered)===String(i)?'wrong':''):''}" data-action="choose" data-qid="${q.id}" data-choice="${i}" ${submitted?'disabled':''} aria-pressed="${String(answered)===String(i)}"><span class="letter">${'ABCD'[i]||i+1}</span>${escapeHtml(o)}</button>`).join('')}</div>`:'';
 let field='';let placeholders=q.placeholder||'Gõ câu trả lời của em ở đây...';
 if(q.type==='short'){field=`<input class="field" data-answer="${q.id}" aria-label="Đáp án ${q.id}" value="${escapeHtml(answered??'')}" placeholder="${escapeHtml(placeholders)}" ${submitted?'disabled':''}>`}
 if(['long','dictation','speaking'].includes(q.type)){let speech=q.type==='speaking',dict=q.type==='dictation',essay=q.id==='w_essay';
 field=`${(speech||dict)?`<div class="voice">${dict?`<button class="btn secondary sm" data-action="play" data-qid="${q.id}">🔊 Nghe chính tả</button>`:''}${speech?`<button class="btn secondary sm" data-action="record" data-qid="${q.id}" ${submitted?'disabled':''}>🎙 Bắt đầu ghi âm</button><button class="btn ghost sm" data-action="replay" data-qid="${q.id}" id="replay-${q.id}" ${APP.blobs[q.id]?'':'disabled'}>▶ Nghe lại</button>`:''}</div>`:''}
 <textarea class="field textarea ${essay?'essay':''} ${dict?'dictation':''}" data-answer="${q.id}" aria-label="Câu trả lời ${q.id}" placeholder="${escapeHtml(speech?'Gõ ngắn gọn câu em vừa nói (không bắt buộc nếu đã nói trực tiếp)...':placeholders)}" ${submitted?'disabled':''}>${escapeHtml(answered??'')}</textarea>`}
 let audio=(q.script&&q.type!=='dictation')?`<div class="voice"><button class="btn secondary sm" data-action="play" data-qid="${q.id}">🔊 Nghe 2 lần</button><span class="small muted">Giọng đọc máy</span></div>`:'';
 let feedback='';if(submitted){if(manual){let gr=w.grades?.[q.id];feedback=`<div class="q-feedback">🧑‍🏫 ${gr===undefined?'Đang chờ gia sư chấm.':`Gia sư đã chấm: ${fmt(gr)}/${q.weight} điểm.`}${w.notes?.[q.id]?'<br>Nhận xét: '+escapeHtml(w.notes[q.id]):''}</div>`;}
 else{let good=typeof q.answer==='number'?`${'ABCD'[q.answer]}. ${q.options[q.answer]}`:(Array.isArray(q.answer)?q.answer[0]:q.answer);feedback=`<div class="q-feedback ${isCorrect?'yes':'no'}">${isCorrect?'✅ Chính xác!':'💡 Chưa đúng.'} Đáp án: <strong>${escapeHtml(good)}</strong>${q.explain?`<br>${escapeHtml(q.explain)}`:''}</div>`;}}
 return `<div class="question" id="q-${q.id}"><div class="q-head"><span class="q-no">${number}</span><div style="flex:1"><b>${escapeHtml(q.prompt)}</b>${q.hint?`<details class="helper"><summary>💡 Gợi ý</summary><p>${escapeHtml(q.hint)}</p></details>`:''}</div><span class="score-chip">${q.weight} điểm</span></div>${audio}${ans}${field}${feedback}</div>`}
function lessonContent(l){let w=getWork(l,true),ss=stats(l,w),passed=!!w.submittedAt;let sections=l.sections.map(s=>{
 let qhtml=s.questions.map(q=>qHtml(q,allQ(l).indexOf(q)+1,l,w)).join('');return `<section class="lesson-section"><div class="lesson-section-head"><h3>${escapeHtml(s.title)}</h3>${s.desc?`<p>${escapeHtml(s.desc)}</p>`:''}</div>${s.passage?`<div class="passage">${escapeHtml(s.passage)}</div>`:''}${qhtml}</section>`}).join('');
 let rd='';if(l.special==='read'){let r=l.readings[w.readingIdx||0];rd=`<div class="panel"><h3>📖 Chọn phiếu đọc</h3><p class="small muted">Chọn một phiếu, sau đó đọc và trả lời câu hỏi. Khi đổi phiếu, câu trả lời của hai câu hỏi sẽ được xóa để làm lại theo đoạn mới.</p><select class="read-select" id="readChoose" ${passed?'disabled':''}>${l.readings.map((r,i)=>`<option value="${i}" ${i===w.readingIdx?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}</select><div class="passage" style="margin:14px 0 5px">${escapeHtml(r.text)}</div>${!passed?'<button class="btn secondary sm" data-action="read-passage">🔊 Nghe đọc mẫu (máy)</button>':''}</div>`}
 let essay='';if(l.special==='write'){essay=`<div class="panel"><h3>💭 Chọn 1 đề tập làm văn</h3><select class="read-select" id="essayChoose" ${passed?'disabled':''}>${l.essayTopics.map((topic,i)=>`<option value="${i}" ${i===w.topicIdx?'selected':''}>Đề ${'ABC'[i]}: ${escapeHtml(topic)}</option>`).join('')}</select><p class="small muted">Bài làm của em sẽ được lưu cùng đề đã chọn.</p></div>`}
 let scoring='';if(passed){scoring=resultCard(l,w);}
 return `<div class="breadcrumb"><button data-action="home">Trang chủ</button> › ${escapeHtml(l.subject)} › ${escapeHtml(l.name)}</div><div class="lesson-heading"><div><div class="strip" style="margin:0 0 10px"><span class="tag">${escapeHtml(l.date)}</span><span class="tag neutral">${escapeHtml(l.subtitle)}</span></div><h1>${l.icon} ${escapeHtml(l.name)}</h1><p class="lead">${escapeHtml(l.description)}</p></div>${l.duration?`<span class="timing" id="timer" data-id="${l.id}">⏱ --:--</span>`:'<span class="timing">🎙 Linh hoạt</span>'}</div>
 ${passed?`<div class="notice green">✅ Bài này đã được nộp. Em có thể xem đáp án và nhận xét; muốn làm lại hãy bấm “Làm lại đề”.</div>`:`<div class="notice">💾 Bài làm được lưu tự động trên thiết bị này. <strong id="progressCount">${ss.answered}/${ss.count} nhiệm vụ đã trả lời</strong>.</div>`}
 ${scoring}${rd}${essay}${sections}<div class="footer-actions"><div><strong>${passed?'Đã hoàn thành bài luyện!':'Sẵn sàng nộp bài?'}</strong><div class="save-msg">${passed?'Kiểm tra đáp án và tự ôn lại các lỗi sai.':'Hãy kiểm tra câu trả lời trước khi nộp.'}</div></div><div class="split"><button class="btn ghost" data-action="home">← Trang chủ</button>${passed?`<button class="btn secondary" data-action="restart" data-id="${l.id}">↻ Làm lại đề</button>`:`<button class="btn green" data-action="submit">Nộp bài & xem kết quả ✓</button>`}</div></div>`}
function resultCard(l,w){let s=stats(l,w),complete=s.final,graded=s.totalAuto+s.manualMax;return `<div class="results"><span class="tag ${complete?'good':'warn'}">${complete?'Bài đã chấm xong':'Đã nộp — chờ gia sư chấm phần tự luận'}</span><h2 style="margin-top:13px">🏆 Kết quả của em</h2><div class="number">${complete?`${fmt(s.score10)} / 10`:`${fmt(s.scoreAuto)} / ${fmt(s.totalAuto)}`}</div><p class="muted small">${complete?'Điểm cuối cùng quy đổi về thang 10.':'Đây chỉ là điểm phần chấm tự động, CHƯA phải tổng điểm bài kiểm tra.'}</p><div class="result-grid"><div class="result-box"><b>${fmt(s.scoreAuto)}/${fmt(s.totalAuto)}</b><span>Phần tự động</span></div><div class="result-box"><b>${s.manualDone}/${s.manualCount}</b><span>Câu gia sư đã chấm</span></div><div class="result-box"><b>${s.answered}/${s.count}</b><span>Nhiệm vụ đã trả lời</span></div></div>${!complete&&s.manualCount?'<div class="notice amber">📌 Gia sư cần mở “Bảng chấm điểm” để chấm các câu tự luận, Speaking hoặc đọc thành tiếng.</div>':''}${complete&&s.score10>=8?'<div class="notice green">🌟 Rất tốt! Em hãy tiếp tục luyện các câu khó để nâng cao điểm số.</div>':''}</div>`}
function teacher(){let p=user();let trs=COURSES.map(l=>{let w=getWork(l),s=stats(l,w);return `<tr><td>${l.icon} ${escapeHtml(l.name)}</td><td>${completionTag(l,w)}</td><td>${w?.submittedAt?escapeHtml(displayScore(l,w)):'—'}</td><td><button class="btn sm secondary" data-action="teacher-lesson" data-id="${l.id}">${w?.submittedAt?'Chấm / Xem':'Xem'}</button></td></tr>`}).join('');let tLesson=lesson(APP.teacherLesson),w=tLesson?getWork(tLesson):null;
 return `<div class="breadcrumb"><button data-action="home">Trang chủ</button> › Bảng chấm điểm</div><h1>📊 Bảng chấm điểm gia sư</h1><p class="lead">Kiểm tra bài làm của học sinh, chấm các phần tự luận và lưu điểm. Dữ liệu chỉ có trên trình duyệt đang sử dụng.</p><div class="panel"><div class="section-head" style="margin:0 0 12px"><h3 style="margin:0">👩‍🎓 Chọn học sinh</h3><button class="btn sm secondary" data-action="profiles">+ Thêm học sinh</button></div><div class="profile-list">${APP.db.profiles.map(item=>`<button class="profile-choice ${item.id===p?.id?'selected':''}" data-action="switch" data-id="${item.id}">${escapeHtml(item.name)}</button>`).join('')}</div><div style="overflow-x:auto"><table class="teacher-table"><thead><tr><th>Bài luyện</th><th>Trạng thái</th><th>Điểm</th><th>Thao tác</th></tr></thead><tbody>${trs}</tbody></table></div></div>
 <div class="panel" style="margin-top:16px"><h3>📥 Lưu và xuất dữ liệu</h3><p class="small muted">Xuất bảng điểm CSV để mở bằng Excel. Xuất JSON nếu muốn chuyển toàn bộ bài làm sang một trình duyệt khác. Không tự đồng bộ qua các máy.</p><div class="split"><button class="btn secondary" data-action="csv">⬇ Xuất điểm CSV</button><button class="btn ghost" data-action="export">⬇ Sao lưu JSON</button><label class="btn ghost" for="importFile">⬆ Nhập bản sao lưu</label><input id="importFile" type="file" accept=".json,application/json" style="display:none"></div></div>
 ${tLesson?teacherDetail(tLesson,w):''}`}
function teacherDetail(l,w){let s=stats(l,w);let manual=allQ(l).filter(isManual),mp=manual.length,html='';if(!w)return `<div class="panel" style="margin-top:17px"><h2>${l.icon} ${escapeHtml(l.name)}</h2><div class="notice amber">Học sinh chưa mở bài này nên chưa có bài làm.</div></div>`;
 if(!w.submittedAt)return `<div class="panel" style="margin-top:17px"><h2>${escapeHtml(l.name)}</h2><div class="notice amber">Học sinh chưa nộp bài. Đã trả lời ${s.answered}/${s.count} câu; gia sư chưa thể chấm.</div></div>`;
 for(let q of manual){let rd=l.special==='read'?l.readings[w.readingIdx||0]:null,prompt=q.prompt;
 if(rd&&q.id==='read_q1')prompt=rd.questions[0];if(rd&&q.id==='read_q2')prompt=rd.questions[1];let entered=w.answers[q.id]||'(Chưa nhập câu trả lời — có thể đã trả lời bằng lời nói)';let guide='';if(rd){if(q.id==='read_oral')guide='Đọc đúng tiếng, không bỏ từ (3đ); ngắt nghỉ, tốc độ, giọng đọc (3đ).';if(q.id==='read_q1')guide=rd.guide[0];if(q.id==='read_q2')guide=rd.guide[1];}
 if(q.id==='w_essay')guide='Đúng yêu cầu, đủ 3 phần (2đ); sự việc rõ, đúng trình tự (3đ); từ ngữ/câu văn (2đ); chính tả/trình bày (1đ).';
 if(q.id==='w_dictation')guide=`Đoạn chuẩn: ${q.script}`;
 if(q.id==='c7')guide='Đọc xong kể lại nội dung; giới thiệu sách hay hoặc điều thú vị.';
 if(q.id==='c8')guide='Ví dụ: phát hiện, vuốt, viết, khen, hiểu, chia sẻ, giữ gìn.';
 if(q.id==='c9')guide='Để giữ sách sạch đẹp cho những bạn đọc sau.';
 if(q.id==='c10')guide='Đúng ý, có việc làm cụ thể, viết 2–3 câu.';
 if(q.id==='m8work')guide='Nêu phép nhân trước, phép cộng sau.';
 if(q.id==='m10work')guide='Ngày 2: 160 quyển. Ngày 3: 80 quyển. Tổng: 125+160+80=365 quyển.';
 if(q.type==='speaking'&&l.id==='global'){let guides={'g_s1':'I am from Viet Nam.','g_s2':'I get up at six o’clock.','g_s3':'I play badminton on Sundays.','g_s4':'My birthday is in June.','g_s5':'Yes, I can. I can ride a bike.'};guide=guides[q.id]||''}
 html+=`<div class="grade-card"><h3>${escapeHtml(prompt)} <span class="score-chip">Tối đa ${q.weight} điểm</span></h3>${q.id==='w_essay'?`<div class="small muted">Đề chọn: ${escapeHtml(l.essayTopics[w.topicIdx||0])}</div>`:''}<div class="answer-view">${escapeHtml(entered)}</div>${guide?`<details class="helper"><summary>📗 Gợi ý đáp án / tiêu chí chấm</summary><p>${escapeHtml(guide)}</p></details>`:''}<div class="grade"><label for="grade-${q.id}">Điểm</label><input type="number" class="field" id="grade-${q.id}" data-grade="${q.id}" data-course="${l.id}" min="0" max="${q.weight}" step="0.1" value="${w.grades?.[q.id]??''}" placeholder="—" aria-label="Điểm câu ${q.id}"><span class="muted small">/ ${q.weight}</span><button class="btn sm ghost" data-action="fullgrade" data-qid="${q.id}" data-course="${l.id}">Cho điểm tối đa</button></div><label class="small muted" for="note-${q.id}">Nhận xét cho học sinh</label><input class="field" id="note-${q.id}" data-grade-note="${q.id}" data-course="${l.id}" placeholder="Điểm tốt / điều cần luyện thêm..." value="${escapeHtml(w.notes?.[q.id]||'')}"></div>`}
 let listening=allQ(l).filter(q=>q.script).map(q=>`<li><b>${escapeHtml(q.prompt)}</b><div class="small muted">${escapeHtml(q.script)}</div></li>`).join('');let scripts=listening?`<details class="helper"><summary>🔊 Hiện lời thoại / bài đọc cho gia sư</summary><ol>${listening}</ol></details>`:'';
 return `<div class="panel" style="margin-top:18px" id="teacherDetail"><div class="section-head" style="margin-top:0"><h2>${l.icon} ${escapeHtml(l.name)}</h2><button class="btn sm secondary" data-action="review" data-id="${l.id}">Xem bài đầy đủ →</button></div><div class="notice">Tự chấm: <b>${fmt(s.scoreAuto)}/${fmt(s.totalAuto)}</b> • Tự luận: <b>${s.manualDone}/${s.manualCount} câu đã chấm</b> • ${s.final?`Điểm cuối: <b>${fmt(s.score10)}/10</b>`:'Chưa có điểm cuối cùng'}</div>${l.special==='read'?`<p class="small muted" style="margin-top:15px">Học sinh chọn: <b>${escapeHtml(l.readings[w.readingIdx||0].name)}</b></p>`:''}${scripts}${mp?`<h3 style="margin-top:22px">✍️ Chấm câu tự luận / vấn đáp</h3>${html}<button class="btn green" data-action="save-grades">💾 Lưu điểm đã nhập</button>`:`<div class="notice green" style="margin-top:15px">Không có câu tự luận, điểm đã được chấm tự động.</div>`}</div>`}
function review(){let l=lesson(APP.lessonId);if(!l)return home();let w=getWork(l);if(!w?.submittedAt){return `<div class="notice amber">Chưa có kết quả. Hãy làm và nộp bài trước.</div><button class="btn" data-action="open" data-id="${l.id}">Mở bài luyện</button>`;}return lessonContent(l)}

 <div class="panel" style="margin-top:16px"><h2>👩‍🏫 Dành cho gia sư</h2><p>Học sinh có thể làm trên máy tính Windows, Mac hoặc trình duyệt điện thoại. Điểm tự luận cần giáo viên chấm; điểm trung bình trong bài bổ trợ được quy đổi về thang 10. Hệ thống lưu tự động vào <strong>trình duyệt hiện tại</strong>.</p><p><b>Đưa website lên mạng:</b> Đổi tên tệp thành <code>index.html</code> rồi tải lên Netlify Drop hoặc GitHub Pages để tạo liên kết chia sẻ cho học sinh. Khi dùng các máy khác nhau, bài làm vẫn chỉ lưu ở từng máy; xuất JSON để chuyển thủ công.</p><p><b>Giới hạn:</b> Không có tài khoản đăng nhập, không lưu bài vào máy chủ và không đồng bộ từ xa. Nên xuất bản sao lưu sau mỗi buổi học.</p><div class="split"><button class="btn secondary" data-action="export">⬇ Sao lưu toàn bộ</button><button class="btn ghost" data-action="teacher">Mở bảng gia sư</button></div></div>`}
function modalProfiles(){let p=user(),content=`<div class="modal-overlay" id="profileModal"><div class="modal" role="dialog" aria-modal="true" aria-label="Quản lý học sinh"><h2>👤 Chọn hoặc thêm học sinh</h2><p class="small muted">Mỗi học sinh có bài làm riêng trên thiết bị.</p><div class="profile-list">${APP.db.profiles.map(u=>`<button class="profile-choice ${u.id===p?.id?'selected':''}" data-action="switch-profile" data-id="${u.id}">${escapeHtml(u.name)}</button>`).join('')}</div><label for="newName"><b>Thêm học sinh mới</b></label><input id="newName" class="field" maxlength="50" placeholder="Họ tên học sinh"><div class="split" style="justify-content:space-between"><button class="btn ghost" data-action="close-profiles">Đóng</button><button class="btn" data-action="add-profile">+ Thêm học sinh</button></div></div></div>`;document.body.insertAdjacentHTML('beforeend',content);$('#newName')?.focus()}
function notify(msg){let old=$('#toast');if(old)old.remove();let el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:min(92vw,420px);background:#27375c;color:white;padding:12px 19px;border-radius:15px;z-index:99;box-shadow:0 12px 35px #17274855;font-size:13px;text-align:center';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3300)}
function render(){if(!user()){appFrame(empty());return;}let content=APP.view==='home'?home():APP.view==='lesson'?lessonContent(lesson(APP.lessonId)):APP.view==='teacher'?teacher():APP.view==='review'?review():help();appFrame(content);}
function addProfile(value){let name=String(value||'').replace(/\s+/g,' ').trim();if(!name){notify('Vui lòng nhập tên học sinh.');return;}let id=`s_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;APP.db.profiles.push({id,name,work:{}});APP.db.selectedId=id;APP.view='home';APP.teacherLesson=null;save();document.querySelector('#profileModal')?.remove();render();}
function updateTimer(){let el=$('#timer');if(!el)return;let l=lesson(el.dataset.id),w=getWork(l);if(!l||!w)return;let seconds=Math.max(0,l.duration*60-Math.floor(((w.submittedAt||Date.now())-w.startedAt)/1000));let mm=Math.floor(seconds/60),ss=seconds%60;el.textContent=`⏱ ${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;el.classList.toggle('expired',seconds===0);if(seconds===0&&!w.submittedAt)el.textContent='⏱ Hết giờ luyện';}
function presentSubmit(){let l=lesson(APP.lessonId),w=getWork(l),s=stats(l,w);if(!w||w.submittedAt)return;let missing=s.count-s.answered;if(!window.confirm(`Em muốn nộp bài ${l.name}?${missing?`\nCòn ${missing} nhiệm vụ chưa có câu trả lời.`:''}\nSau khi nộp, em có thể xem đáp án và kết quả.`))return;w.submittedAt=Date.now();save();render();scrollTo({top:0,behavior:'smooth'});notify('🎉 Đã nộp bài! Em hãy xem kết quả nhé.');}
function changeReading(idx){let l=lesson(APP.lessonId),w=getWork(l);if(!w||w.submittedAt)return;if((w.answers.read_q1||w.answers.read_q2)&&!confirm('Đổi phiếu sẽ xóa hai câu trả lời đã nhập. Em muốn đổi chứ?')){render();return;}w.readingIdx=idx;w.answers.read_q1='';w.answers.read_q2='';save();render();}
function changeEssay(idx){let l=lesson(APP.lessonId),w=getWork(l);if(!w||w.submittedAt)return;if(String(w.answers.w_essay||'').trim()&&!confirm('Đổi đề mới nhưng giữ nguyên bài văn đang viết?'))return;w.topicIdx=idx;save();render();}
function speakText(text,lang='en-US',repeat=2,rate=.86){stopSound();if(!('speechSynthesis' in window)){notify('Trình duyệt không có tính năng đọc. Gia sư hãy đọc lời thoại trong phần Bảng chấm điểm.');return;}
 try{let synth=window.speechSynthesis;let voices=synth.getVoices();let list=voices.filter(v=>v.lang.toLowerCase().startsWith(lang==='vi-VN'?'vi':'en'));let voice=list.find(v=>v.lang===lang)||list[0];let queue=[];for(let i=0;i<repeat;i++){let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.pitch=1;u.volume=1;if(voice)u.voice=voice;queue.push(u)}queue.forEach(u=>synth.speak(u));}catch(e){notify('Không mở được giọng đọc. Gia sư có thể đọc lời thoại thay thế.')}}
function findQuestion(l,id){return allQ(l).find(q=>q.id===id)}
function playQ(qid){let l=lesson(APP.lessonId),q=findQuestion(l,qid);if(!q?.script)return;let vi=q.type==='dictation';speakText(q.script,vi?'vi-VN':'en-US',vi?1:2,vi?.78:.82);}
async function doRecord(qid){let btn=document.querySelector(`[data-action="record"][data-qid="${qid}"]`);if(APP.recorder&&APP.recorder.state==='recording'){APP.recorder.stop();if(btn){btn.textContent='🎙 Bắt đầu ghi âm';}return;}
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){notify('Trình duyệt không hỗ trợ ghi âm ở chế độ này. Em hãy nói trực tiếp với gia sư.');return;}
 try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];let rec=new MediaRecorder(stream);APP.recorder=rec;rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});if(APP.blobs[qid])URL.revokeObjectURL(APP.blobs[qid]);APP.blobs[qid]=URL.createObjectURL(blob);stream.getTracks().forEach(t=>t.stop());APP.recorder=null;notify('Ghi âm xong! Em có thể nghe lại. Lưu ý: ghi âm chỉ tồn tại khi đang mở trang.');let replay=$(`#replay-${qid}`);if(replay)replay.disabled=false};rec.start();if(btn)btn.textContent='⏹ Dừng ghi âm';notify('Đang ghi âm. Bấm nút một lần nữa để dừng.')}catch(err){notify('Không có quyền dùng micro. Em có thể trả lời trực tiếp cho gia sư hoặc gõ câu trả lời.')}}
function fileDownload(filename,txt,mime='text/plain;charset=utf-8'){let blob=new Blob([txt],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){fileDownload('hoc_vui_lop4_sao_luu_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:2,exportedAt:new Date().toISOString(),data:APP.db},null,2),'application/json');notify('Đã tạo file sao lưu JSON.');}
function escapeCsv(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportCsv(){let lines=[['Học sinh','Bài luyện','Ngày nộp','Trạng thái','Đã chấm tự động','Điểm phần tự động','Câu tự luận đã chấm','Tổng câu tự luận','Điểm cuối thang 10'].map(escapeCsv).join(',')];for(let p of APP.db.profiles){for(let l of COURSES){let w=p.work?.[l.id];if(!w)continue;let s=stats(l,w);let cols=[p.name,l.name,w.submittedAt?new Date(w.submittedAt).toLocaleString('vi-VN'):'',w.submittedAt?(s.final?'Đã chấm':'Chờ chấm'):'Đang làm',s.totalAuto,s.scoreAuto,s.manualDone,s.manualCount,w.submittedAt&&s.final?fmt(s.score10):''];lines.push(cols.map(escapeCsv).join(','))}}
 fileDownload('bang_diem_lop4_'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8');notify('Đã tạo bảng điểm CSV.');}
async function importJSON(file){if(!file)return;try{let obj=JSON.parse(await file.text());let content=obj.data||obj;if(!Array.isArray(content.profiles)||content.profiles.some(p=>typeof p.id!=='string'||typeof p.name!=='string'||typeof p.work!=='object'))throw Error('Định dạng sai');if(!confirm('Nhập bản sao lưu sẽ THAY THẾ dữ liệu hiện có trên trình duyệt này. Bạn có chắc chắn?'))return;APP.db=content;APP.view='home';APP.teacherLesson=null;if(!user()&&APP.db.profiles.length)APP.db.selectedId=APP.db.profiles[0].id;save();render();notify('Đã nhập bản sao lưu thành công.');}catch(e){notify('Không thể đọc bản sao lưu JSON. Kiểm tra lại tệp.')}}
function saveGrades(){let l=lesson(APP.teacherLesson),w=getWork(l);if(!w?.submittedAt)return;let inputs=document.querySelectorAll('[data-grade]');for(let input of inputs){let q=findQuestion(l,input.dataset.grade),str=input.value.trim();if(str===''){delete w.grades[q.id];continue;}let n=Number(str);if(!Number.isFinite(n)||n<0||n>q.weight){notify(`Điểm phải trong khoảng từ 0 đến ${q.weight}.`);input.focus();return;}w.grades[q.id]=Math.round(n*10)/10;}
 for(let input of document.querySelectorAll('[data-grade-note]')){w.notes[input.dataset.gradeNote]=input.value;}save();render();notify('✅ Đã lưu điểm và nhận xét.');}
function clickAction(evt){let t=evt.target.closest('[data-action]');if(!t)return;let a=t.dataset.action,id=t.dataset.id;
 if(a==='home')toHome();else if(a==='open')openLesson(id);else if(a==='teacher')goTeacher();else if(a==='help'){APP.view='help';APP.menu=false;render();scrollTo(0,0)}else if(a==='menu'){APP.menu=!APP.menu;render()}
 else if(a==='review')showReview(id);else if(a==='add-initial')addProfile($('#nameInitial')?.value);else if(a==='profiles')modalProfiles();else if(a==='close-profiles')$('#profileModal')?.remove();else if(a==='add-profile')addProfile($('#newName')?.value);else if(a==='switch-profile'||a==='switch'){APP.db.selectedId=id;APP.teacherLesson=null;save();$('#profileModal')?.remove();APP.menu=false;render()}
 else if(a==='choose'){saveAnswer(t.dataset.qid,t.dataset.choice);let scroll=window.scrollY;render();scrollTo(0,scroll)}else if(a==='submit')presentSubmit();else if(a==='restart'){if(!confirm('Làm lại bài này sẽ xóa câu trả lời và điểm lần trước. Bạn có muốn tiếp tục?'))return;let l=lesson(id),p=user();p.work[id]={startedAt:Date.now(),answers:{},grades:{},notes:{},submittedAt:null,readingIdx:0,topicIdx:0};save();openLesson(id)}
 else if(a==='play')playQ(t.dataset.qid);else if(a==='read-passage'){let l=lesson(APP.lessonId),w=getWork(l);speakText(l.readings[w.readingIdx||0].text,'vi-VN',1,.82)}else if(a==='record')doRecord(t.dataset.qid);else if(a==='replay'&&APP.blobs[t.dataset.qid]){let audio=new Audio(APP.blobs[t.dataset.qid]);audio.play().catch(()=>notify('Không thể mở bản ghi âm.'))}
 else if(a==='teacher-lesson'){APP.teacherLesson=id;render();setTimeout(()=>document.getElementById('teacherDetail')?.scrollIntoView({behavior:'smooth',block:'start'}),80)}else if(a==='save-grades')saveGrades();else if(a==='fullgrade'){let l=lesson(t.dataset.course),q=findQuestion(l,t.dataset.qid),input=document.getElementById('grade-'+q.id);if(input)input.value=q.weight;}
 else if(a==='csv')exportCsv();else if(a==='export')exportJSON();}
function onInput(evt){let el=evt.target;
 if(el.matches('[data-answer]')){saveAnswer(el.dataset.answer,el.value);let chars=el.value.trim().length;let counter=el.parentNode.querySelector('.word-count');if(counter)counter.textContent=`${chars} ký tự`}
 if(el.id==='nameInitial'&&evt.key==='Enter')addProfile(el.value);}
function onChange(evt){let el=evt.target;if(el.id==='readChoose')changeReading(Number(el.value));else if(el.id==='essayChoose')changeEssay(Number(el.value));else if(el.id==='importFile')importJSON(el.files?.[0]);}
load();document.addEventListener('click',clickAction);document.addEventListener('input',onInput);document.addEventListener('change',onChange);document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target?.id==='newName'||e.target?.id==='nameInitial')){e.preventDefault();addProfile(e.target.value)}if(e.key==='Escape')$('#profileModal')?.remove();});window.addEventListener('beforeunload',()=>{stopSound();});setInterval(updateTimer,1000);render();
</script>
</body></html>
